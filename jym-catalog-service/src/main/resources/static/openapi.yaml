openapi: 3.0.1
info:
  title: Jymusic 상품 카탈로그 서비스 API
  description: |
    상품 정보, 카테고리 조회, 관리자 상품 CRUD 및 S3 Presigned URL 발급을 위한 API 명세입니다.

    **인증 방식**: API Gateway가 JWT를 검증하고 `X-User-Id`, `X-User-Role` 헤더를 주입합니다.
    관리자 API는 `Authorization: Bearer <token>` 헤더가 필요합니다.
  version: 1.1.0

servers:
  - url: /api/v1
    description: API 게이트웨이 경로

security: []

tags:
  - name: 상품 (공개)
    description: 인증 없이 접근 가능한 상품 조회 API
  - name: 상품 (관리자)
    description: ROLE_ADMIN 권한 필요
  - name: 카테고리
    description: 카테고리 조회 API
  - name: 미디어
    description: S3 Presigned URL 발급 (ROLE_ADMIN)

paths:
  /products:
    get:
      tags:
        - 상품 (공개)
      summary: 상품 목록 조회
      description: 페이징과 카테고리 필터 기능을 지원하여 판매 중인 상품 목록을 조회합니다.
      parameters:
        - name: page
          in: query
          description: 페이지 번호 (0부터 시작)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: 한 페이지당 항목 수
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 100
        - name: categoryId
          in: query
          description: 특정 카테고리로 필터링 (미지정 시 전체 조회)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 상품 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

    post:
      tags:
        - 상품 (관리자)
      summary: 상품 등록
      description: 새로운 음악 앨범 상품을 등록합니다. `ROLE_ADMIN` 권한이 필요합니다.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              title: "Abbey Road"
              artist: "The Beatles"
              description: "1969년 발매된 비틀즈의 명반"
              price: 29000
              stockQuantity: 100
              categoryId: 2
              imageKey: "products/uuid-abbey-road.jpg"
      responses:
        '201':
          description: 상품 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: 카테고리를 찾을 수 없음
          $ref: '#/components/responses/ErrorResponse'

  /products/{productId}:
    get:
      tags:
        - 상품 (공개)
      summary: 상품 상세 정보 조회
      description: 특정 상품의 상세 설명, 가격, 재고 등을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 상품 상세 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

    put:
      tags:
        - 상품 (관리자)
      summary: 상품 정보 수정
      description: 기존 상품 정보를 수정합니다. `ROLE_ADMIN` 권한이 필요합니다.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            example:
              title: "Abbey Road (Remastered)"
              artist: "The Beatles"
              description: "리마스터링된 비틀즈 명반"
              price: 32000
              stockQuantity: 80
              categoryId: 2
              imageKey: "products/uuid-abbey-road-remastered.jpg"
      responses:
        '200':
          description: 상품 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

    delete:
      tags:
        - 상품 (관리자)
      summary: 상품 삭제 (논리 삭제)
      description: |
        상품을 비활성화 처리합니다 (`isAvailable = false`).
        물리적 삭제가 아닌 논리 삭제로, 조회 API에서 더 이상 반환되지 않습니다.
        `ROLE_ADMIN` 권한이 필요합니다.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: 상품 삭제 성공 (응답 본문 없음)
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /categories:
    get:
      tags:
        - 카테고리
      summary: 모든 상품 카테고리 조회
      description: 음악 장르 및 상품 카테고리 목록 전체를 조회합니다.
      responses:
        '200':
          description: 카테고리 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
              example:
                - id: 1
                  name: "Rock"
                - id: 2
                  name: "Pop"
                - id: 3
                  name: "Jazz"

  /media/presigned-url:
    post:
      tags:
        - 미디어
      summary: S3 Presigned URL 발급
      description: |
        클라이언트가 S3에 직접 파일을 업로드할 수 있는 Presigned PUT URL을 발급합니다.
        발급된 URL은 10분간 유효합니다. `ROLE_ADMIN` 권한이 필요합니다.

        **클라이언트 업로드 흐름**:
        1. `POST /api/v1/media/presigned-url` → `{ presignedUrl, objectKey }` 수신
        2. `PUT {presignedUrl}` (S3 직접 업로드, `Content-Type` 헤더 필수)
        3. 상품 등록/수정 요청 시 `imageKey: objectKey` 포함
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUrlRequest'
            example:
              filename: "abbey-road.jpg"
              contentType: "image/jpeg"
      responses:
        '200':
          description: Presigned URL 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
              example:
                presignedUrl: "https://jymusic-bucket.s3.ap-northeast-2.amazonaws.com/products/uuid-abbey-road.jpg?X-Amz-..."
                objectKey: "products/uuid-abbey-road.jpg"
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          description: Presigned URL 생성 실패
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API Gateway에서 검증된 JWT 토큰

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: 상품의 고유 ID
      schema:
        type: integer
        format: int64

  responses:
    ErrorResponse:
      description: GlobalExceptionHandler 기반 공통 오류 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            code: "ERR_PRODUCT_NOT_FOUND"
            message: "상품을 찾을 수 없습니다."
            timestamp: "2026-03-10T12:00:00"

  schemas:
    # ─── 요청 스키마 ───────────────────────────────────────────────────────

    ProductCreateRequest:
      type: object
      required:
        - title
        - artist
        - price
        - stockQuantity
        - categoryId
      properties:
        title:
          type: string
          description: 앨범명
          maxLength: 100
          example: "Abbey Road"
        artist:
          type: string
          description: 아티스트명
          maxLength: 100
          example: "The Beatles"
        description:
          type: string
          description: 상품 상세 설명 (선택)
          maxLength: 2000
        price:
          type: number
          format: double
          description: 상품 가격 (0 이상)
          minimum: 0
          example: 29000
        stockQuantity:
          type: integer
          description: 재고 수량 (0 이상 정수)
          minimum: 0
          example: 100
        categoryId:
          type: integer
          format: int64
          description: 카테고리 ID
          example: 2
        imageKey:
          type: string
          nullable: true
          description: S3 objectKey (Presigned URL 업로드 후 획득한 값)
          example: "products/uuid-abbey-road.jpg"

    ProductUpdateRequest:
      type: object
      required:
        - title
        - artist
        - price
        - stockQuantity
        - categoryId
      properties:
        title:
          type: string
          maxLength: 100
          example: "Abbey Road (Remastered)"
        artist:
          type: string
          maxLength: 100
          example: "The Beatles"
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: double
          minimum: 0
          example: 32000
        stockQuantity:
          type: integer
          minimum: 0
          example: 80
        categoryId:
          type: integer
          format: int64
          example: 2
        imageKey:
          type: string
          nullable: true
          description: |
            변경 없으면 기존 objectKey 그대로 전송.
            이미지 삭제 시 `null` 전송.
          example: "products/uuid-abbey-road-remastered.jpg"

    PresignedUrlRequest:
      type: object
      required:
        - filename
        - contentType
      properties:
        filename:
          type: string
          description: 원본 파일명
          example: "abbey-road.jpg"
        contentType:
          type: string
          description: 파일 MIME 타입
          example: "image/jpeg"

    # ─── 응답 스키마 ───────────────────────────────────────────────────────

    ProductSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          description: 앨범명
          example: "Abbey Road"
        artist:
          type: string
          description: 아티스트명
          example: "The Beatles"
        price:
          type: number
          format: double
          example: 29000
        thumbnailUrl:
          type: string
          nullable: true
          description: 목록용 썸네일 이미지 URL (imageKey 기반 조합)
          example: "https://jymusic-bucket.s3.ap-northeast-2.amazonaws.com/products/uuid-abbey-road.jpg"

    ProductListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummaryResponse'
        totalElements:
          type: integer
          format: int64
          description: 전체 상품 수
          example: 58
        totalPages:
          type: integer
          description: 전체 페이지 수
          example: 5

    ProductDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 42
        title:
          type: string
          example: "Abbey Road"
        artist:
          type: string
          example: "The Beatles"
        description:
          type: string
          example: "1969년 발매된 비틀즈의 명반"
        price:
          type: number
          format: double
          example: 29000
        stockQuantity:
          type: integer
          description: 현재 재고 수량
          example: 15
        imageUrl:
          type: string
          nullable: true
          description: 상세용 이미지 URL (imageKey 기반 조합)
          example: "https://jymusic-bucket.s3.ap-northeast-2.amazonaws.com/products/uuid-abbey-road.jpg"
        categoryId:
          type: integer
          format: int64
          description: 카테고리 ID
          example: 2
        categoryName:
          type: string
          description: 카테고리명
          example: "Rock"

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          description: 카테고리명 (예: Rock, Pop, Jazz)
          example: "Rock"

    PresignedUrlResponse:
      type: object
      properties:
        presignedUrl:
          type: string
          description: S3 PUT 요청에 사용할 Presigned URL (유효시간 10분)
          example: "https://jymusic-bucket.s3.ap-northeast-2.amazonaws.com/products/uuid-abbey-road.jpg?X-Amz-..."
        objectKey:
          type: string
          description: S3 objectKey — 상품 등록/수정 요청의 imageKey 값으로 사용
          example: "products/uuid-abbey-road.jpg"

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP 상태 코드
          example: 404
        code:
          type: string
          description: 에러 코드
          example: "ERR_PRODUCT_NOT_FOUND"
        message:
          type: string
          description: 에러 메시지
          example: "상품을 찾을 수 없습니다."
        timestamp:
          type: string
          format: date-time
          example: "2026-03-10T12:00:00"
