openapi: 3.0.1
info:
  title: Jymusic 회원 및 인증 서비스 API
  description: 사용자 인증, 회원가입 및 프로필 관리를 위한 API 명세입니다.
  version: 1.0.0
servers:
  - url: /api/v1
    description: API 게이트웨이 경로

paths:
  /auth/register:
    post:
      tags:
        - 인증/권한
      summary: 신규 회원 가입
      description: 새로운 사용자를 시스템에 등록합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 회원 가입 성공
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /auth/login:
    post:
      tags:
        - 인증/권한
      summary: 사용자 로그인
      description: 유니크한 username과 비밀번호로 로그인하여 JWT 토큰을 발급받습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/refresh-token:
    post:
      tags:
        - 인증/권한
      summary: Access Token 갱신
      description: |
        HttpOnly Cookie의 Refresh Token을 검증하여 새 Access Token을 발급합니다.
        **Refresh Token Rotation(RTR)** 이 적용되어 새 Refresh Token도 Cookie로 재설정됩니다.
        - 요청 바디 없음. 쿠키(`refreshToken`)를 자동으로 읽습니다.
        - 갱신 성공 시 기존 Refresh Token은 Redis에서 즉시 무효화됩니다.
      responses:
        "200":
          description: 토큰 갱신 성공
          headers:
            Set-Cookie:
              description: 새 Refresh Token이 HttpOnly Cookie로 설정됩니다.
              schema:
                type: string
                example: refreshToken=eyJ...; Path=/; HttpOnly; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - 인증/권한
      summary: 로그아웃
      description: |
        Redis에서 Refresh Token을 삭제하고 Cookie를 만료시킵니다.
        Access Token은 클라이언트(Pinia store)에서 직접 제거합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 로그아웃 성공
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/oauth2/{provider}:
    get:
      tags:
        - 인증/권한
      summary: 소셜 로그인 시작
      description: |
        지정된 OAuth Provider의 인가 화면으로 리다이렉트합니다.
        지원 Provider: `google`, `kakao`
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, kakao]
          description: OAuth Provider 이름 (소문자)
      responses:
        "302":
          description: Provider 인가 URL로 리다이렉트
          headers:
            Location:
              description: OAuth Provider 인가 URL
              schema:
                type: string
                example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /auth/oauth2/callback/{provider}:
    get:
      tags:
        - 인증/권한
      summary: OAuth 콜백 처리
      description: |
        OAuth Provider로부터 Authorization Code를 수신하여 처리합니다.
        1. code로 Provider Access Token 교환
        2. Provider UserInfo 조회
        3. 기존 회원이면 로그인, 신규면 자동 가입
        4. JWT(AT/RT) 발급 후 프론트엔드로 리다이렉트
        - Refresh Token은 HttpOnly Cookie로 설정됩니다.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, kakao]
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: OAuth Authorization Code
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: CSRF 방지용 State 파라미터
      responses:
        "302":
          description: 프론트엔드 성공 페이지로 리다이렉트 (accessToken은 query parameter로 전달)
          headers:
            Location:
              description: "프론트엔드 OAuth 성공 URL (예: http://localhost:3000/auth/oauth2/success?accessToken=eyJ...)"
              schema:
                type: string
            Set-Cookie:
              description: Refresh Token이 HttpOnly Cookie로 설정됩니다.
              schema:
                type: string
                example: refreshToken=eyJ...; Path=/; HttpOnly; Max-Age=604800
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /members/me:
    get:
      tags:
        - 회원
      summary: 내 프로필 조회
      description: 현재 로그인한 사용자의 상세 정보를 조회합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorResponse:
      description: GlobalErrorHandler 기반의 공통 오류 응답
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterRequest:
      type: object
      required: [username, password, nickname]
      properties:
        username:
          type: string
          format: username
          description: 사용자 로그인 아이디
        password:
          type: string
          minLength: 4
          description: 비밀번호 (최소 4자 이상)
        nickname:
          type: string
          description: 서비스에서 사용할 닉네임
        email:
          type: string
          description: 사용자 이메일 주소

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 액세스 토큰
        tokenType:
          type: string
          example: Bearer

    MemberProfile:
      type: object
      properties:
        id:
          type: integer
          description: 사용자 고유 식별자
        email:
          type: string
          format: email
          description: 사용자 이메일 주소
        username:
          type: string
          description: 사용자 로그인 아이디 (또는 별칭)
        nickname:
          type: string
          description: 서비스 내 표시될 닉네임
        role:
          type: string
          description: 사용자의 시스템 권한 수준
          enum: [ROLE_ADMIN, ROLE_USER]
          example: ROLE_USER
        authProvider:
          type: string
          description: 로그인 출처 (LOCAL, GOOGLE, KAKAO)
          enum: [LOCAL, GOOGLE, KAKAO]
          example: LOCAL

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP 상태 코드
        code:
          type: string
          description: 내부 정의 비즈니스 오류 코드
        message:
          type: string
          description: 상세 오류 메시지
        timestamp:
          type: string
          format: date-time
