openapi: 3.0.1
info:
  title: Jymusic 주문 서비스 API
  description: 새로운 주문 생성, 주문 내역 조회 및 상태 관리를 위한 API 명세입니다.
  version: 1.0.0
servers:
  - url: /api/v1
    description: API 게이트웨이 경로

paths:
  /orders:
    post:
      tags:
        - 주문
      summary: 새로운 주문 생성
      description: 장바구니에 담긴 상품 또는 단일 상품에 대한 주문을 생성합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

    get:
      tags:
        - 주문
      summary: 현재 사용자의 주문 목록 조회
      description: 로그인한 사용자의 과거 주문 내역을 모두 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 주문 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

  /orders/{orderId}:
    get:
      tags:
        - 주문
      summary: 특정 주문 상세 정보 조회
      description: 주문 번호를 통해 해당 주문의 결제 상태, 상품 상세 내역 등을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: 조회할 주문 ID
          schema:
            type: integer
      responses:
        '200':
          description: 주문 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorResponse:
      description: GlobalErrorHandler 기반의 공통 오류 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 주문할 상품 목록
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          description: 주문할 상품 ID
        quantity:
          type: integer
          description: 주문 수량

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          description: 주문 고유 ID
        totalAmount:
          type: number
          description: 총 결제 예정 금액
        status:
          type: string
          description: 주문 상태
          enum: [PENDING, PAID, SHIPPED, COMPLETED, CANCELLED]
        createdAt:
          type: string
          format: date-time
          description: 주문 생성 일시

    OrderDetail:
      type: object
      properties:
        id:
          type: integer
        totalAmount:
          type: number
        status:
          type: string
        items:
          type: array
          description: 주문 상세 상품 내역
          items:
            $ref: '#/components/schemas/OrderItemDetail'
        createdAt:
          type: string
          format: date-time

    OrderItemDetail:
      type: object
      properties:
        productId:
          type: integer
        productTitle:
          type: string
          description: 상품명
        price:
          type: number
          description: 주문 당시 개당 가격
        quantity:
          type: integer

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
