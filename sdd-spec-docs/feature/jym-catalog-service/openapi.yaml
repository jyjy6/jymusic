openapi: 3.0.1
info:
  title: Jymusic 상품 카탈로그 서비스 API
  description: 상품 정보, 카테고리 조회 및 재고 확인을 위한 API 명세입니다.
  version: 1.0.0
servers:
  - url: /api/v1
    description: API 게이트웨이 경로

paths:
  /products:
    get:
      tags:
        - 상품
      summary: 상품 목록 조회
      description: 페이징과 필터 기능을 지원하여 상품 목록을 조회합니다.
      parameters:
        - name: page
          in: query
          description: 페이지 번호 (0부터 시작)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: 한 페이지당 항목 수
          schema:
            type: integer
            default: 10
        - name: categoryId
          in: query
          description: 특정 카테고리 필터링
          schema:
            type: integer
      responses:
        '200':
          description: 상품 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /products/{productId}:
    get:
      tags:
        - 상품
      summary: 상품 상세 정보 조회
      description: 특정 상품의 상세 설명, 가격, 재고 등을 조회합니다.
      parameters:
        - name: productId
          in: path
          required: true
          description: 조회할 상품의 고유 ID
          schema:
            type: integer
      responses:
        '200':
          description: 상품 상세 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /categories:
    get:
      tags:
        - 카테고리
      summary: 모든 상품 카테고리 조회
      description: 음악 장르 및 상품 카테고리 목록을 조회합니다.
      responses:
        '200':
          description: 카테고리 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

components:
  responses:
    ErrorResponse:
      description: GlobalErrorHandler 기반의 공통 오류 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProductSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          description: 앨범 명/상품 명
        artist:
          type: string
          description: 아티스트 명
        price:
          type: number
          format: double
        thumbnailUrl:
          type: string
          description: 상품 목록용 썸네일 이미지 주소

    ProductList:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        totalElements:
          type: integer
          description: 전체 상품 수
        totalPages:
          type: integer
          description: 전체 페이지 수

    ProductDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string
        description:
          type: string
          description: 상품 상세 설명
        price:
          type: number
        stockQuantity:
          type: integer
          description: 현재 재고 수량
        imageUrl:
          type: string
          description: 상품 상세 이미지 주소

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: 카테고리명 (예: Rock, Pop, Jazz)

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
