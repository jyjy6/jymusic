openapi: 3.0.1
info:
  title: Jymusic 주문 서비스 API
  description: 장바구니 관리, 주문 생성, 주문 내역 조회 및 상태 관리를 위한 API 명세입니다.
  version: 2.0.0
servers:
  - url: /api/v1
    description: API 게이트웨이 경로

paths:
  # ─────────────────────────────────────────
  # 장바구니 (Cart)
  # ─────────────────────────────────────────
  /cart:
    get:
      tags:
        - 장바구니
      summary: 내 장바구니 조회
      description: 현재 로그인한 사용자의 장바구니와 담긴 상품 목록을 조회합니다. 장바구니가 없으면 빈 목록을 반환합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 장바구니 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

    delete:
      tags:
        - 장바구니
      summary: 장바구니 전체 비우기
      description: 현재 로그인한 사용자의 장바구니에 담긴 모든 상품을 삭제합니다.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 장바구니 비우기 성공
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /cart/items:
    post:
      tags:
        - 장바구니
      summary: 장바구니에 상품 추가
      description: |
        상품을 장바구니에 추가합니다.
        동일 상품이 이미 존재하면 수량을 누적합니다 (UPSERT).
        장바구니가 없으면 자동 생성합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '200':
          description: 상품 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /cart/items/{cartItemId}:
    put:
      tags:
        - 장바구니
      summary: 장바구니 아이템 수량 변경
      description: 특정 아이템의 수량을 변경합니다. 수량이 0이면 해당 아이템을 삭제합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          description: 수량을 변경할 장바구니 아이템 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: 수량 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

    delete:
      tags:
        - 장바구니
      summary: 장바구니 특정 아이템 삭제
      description: 장바구니에서 특정 아이템을 삭제합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          description: 삭제할 장바구니 아이템 ID
          schema:
            type: integer
      responses:
        '204':
          description: 아이템 삭제 성공
        '404':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────
  # 주문 (Order)
  # ─────────────────────────────────────────
  /orders:
    post:
      tags:
        - 주문
      summary: 새로운 주문 생성
      description: 장바구니에 담긴 상품 또는 단일 상품에 대한 주문을 생성합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

    get:
      tags:
        - 주문
      summary: 현재 사용자의 주문 목록 조회
      description: 로그인한 사용자의 과거 주문 내역을 모두 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 주문 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

  /orders/{orderId}:
    get:
      tags:
        - 주문
      summary: 특정 주문 상세 정보 조회
      description: 주문 번호를 통해 해당 주문의 결제 상태, 상품 상세 내역 등을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: 조회할 주문 ID
          schema:
            type: integer
      responses:
        '200':
          description: 주문 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────
  # 관리자 주문 관리 (Admin Orders)
  # ─────────────────────────────────────────
  /admin/orders:
    get:
      tags:
        - 관리자-주문
      summary: 전체 주문 검색 (페이징)
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: productTitle
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: statuses
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
          style: form
          explode: false
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: minAmount
          in: query
          schema:
            type: integer
            format: int64
        - name: maxAmount
          in: query
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: 주문 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderPage'
        '403':
          $ref: '#/components/responses/ErrorResponse'

  /admin/orders/{orderId}:
    get:
      tags:
        - 관리자-주문
      summary: 주문 상세 조회 (관리자)
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 주문 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetailResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /admin/orders/{orderId}/status:
    patch:
      tags:
        - 관리자-주문
      summary: 주문 상태 변경 (관리자)
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStatusUpdateRequest'
      responses:
        '200':
          description: 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetailResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /admin/orders/stats:
    get:
      tags:
        - 관리자-주문
      summary: 상태별 주문 수
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 상태별 카운트
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64

  # ─────────────────────────────────────────
  # 알림 (SSE)
  # ─────────────────────────────────────────
  /notifications/stream:
    get:
      tags:
        - 알림
      summary: 사용자 실시간 알림 스트림 구독
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE 스트림 연결 성공
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /notifications/admin/stream:
    get:
      tags:
        - 알림
      summary: 관리자 실시간 알림 스트림 구독
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE 스트림 연결 성공
          content:
            text/event-stream:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorResponse:
      description: GlobalErrorHandler 기반의 공통 오류 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    OrderStatus:
      type: string
      enum: [PENDING, STOCK_RESERVED, PAID, SHIPPED, COMPLETED, CANCELLED]

    # ── 장바구니 스키마 ──
    CartItem:
      type: object
      properties:
        cartItemId:
          type: integer
          description: 장바구니 아이템 고유 ID
        productId:
          type: integer
          description: 상품 ID
        title:
          type: string
          description: 상품명 (앨범 제목)
        artist:
          type: string
          description: 아티스트명
        thumbnailUrl:
          type: string
          nullable: true
          description: 썸네일 이미지 URL
        price:
          type: number
          description: 현재 상품 가격 (₩)
        quantity:
          type: integer
          description: 담긴 수량

    CartResponse:
      type: object
      properties:
        cartId:
          type: integer
          description: 장바구니 고유 ID
        items:
          type: array
          description: 장바구니에 담긴 상품 목록
          items:
            $ref: '#/components/schemas/CartItem'

    AddToCartRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          description: 담을 상품 ID
        quantity:
          type: integer
          description: 담을 수량 (최소 1)
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          description: 변경할 수량 (0이면 해당 아이템 삭제)
          minimum: 0

    # ── 주문 스키마 ──
    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 주문할 상품 목록
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          description: 주문할 상품 ID
        quantity:
          type: integer
          description: 주문 수량

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          description: 주문 고유 ID
        totalAmount:
          type: number
          description: 총 결제 예정 금액
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
          description: 주문 생성 일시

    OrderDetail:
      type: object
      properties:
        id:
          type: integer
        totalAmount:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          description: 주문 상세 상품 내역
          items:
            $ref: '#/components/schemas/OrderItemDetail'
        createdAt:
          type: string
          format: date-time

    OrderItemDetail:
      type: object
      properties:
        productId:
          type: integer
        productTitle:
          type: string
          description: 상품명
        price:
          type: number
          description: 주문 당시 개당 가격
        quantity:
          type: integer

    AdminStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: string
          maxLength: 255

    AdminOrderSummaryResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        totalAmount:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        itemCount:
          type: integer
        firstItemTitle:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminOrderDetailResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOrderSummaryResponse'
        - type: object
          properties:
            email:
              type: string
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemDetail'
            allowedNextStatuses:
              type: array
              items:
                $ref: '#/components/schemas/OrderStatus'

    AdminOrderPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderSummaryResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
